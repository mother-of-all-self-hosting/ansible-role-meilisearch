---
# The command for obtaining API keys: `ansible-playbook -i inventory/hosts setup.yml --tags=backup-meilisearch -e api_key=YOUR_API_KEY_HERE`

- name: Fail if playbook called incorrectly for Meilisearch
  ansible.builtin.fail:
    msg: "The `api_key` variable needs to be provided via --extra-vars"
  when: "api_key is not defined or api_key == 'YOUR_API_KEY_HERE'"

- name: Ensure Meilisearch service is started
  ansible.builtin.service:
    name: "{{ meilisearch_identifier }}"
    state: started
    daemon_reload: true
  register: meilisearch_start

- name: Wait a while, so that Meilisearch can manage to start
  ansible.builtin.pause:
    seconds: 7
  when: meilisearch_start.changed | bool

- name: Run Meilisearch command for creating a snapshot
  ansible.builtin.shell: |-
    {{ devture_systemd_docker_base_host_command_docker }} exec
    --user={{ meilisearch_uid }}:{{ meilisearch_gid }}
    {{ meilisearch_identifier }} curl -sSf -X POST
    -H 'Authorization: Bearer {{ api_key }}'
    'http://localhost:{{ meilisearch_container_http_port }}/snapshots'
  register: meilisearch_snapshots_result
  no_log: true # hide the API key

# Meilisearch answers the request above with a `202 Accepted` and a task identifier;
# the snapshot itself is written afterwards, and can still fail. Reporting success on
# the acknowledgement alone would tell somebody their backup was taken when it was not.
- name: Wait for the Meilisearch snapshot task to finish
  ansible.builtin.shell: |-
    {{ devture_systemd_docker_base_host_command_docker }} exec
    --user={{ meilisearch_uid }}:{{ meilisearch_gid }}
    {{ meilisearch_identifier }} curl -sSf
    -H 'Authorization: Bearer {{ api_key }}'
    'http://localhost:{{ meilisearch_container_http_port }}/tasks/{{ (meilisearch_snapshots_result.stdout | from_json).taskUid }}'
  register: meilisearch_snapshot_task_result
  until: "(meilisearch_snapshot_task_result.stdout | from_json).status in ['succeeded', 'failed', 'canceled']"
  # Snapshotting copies the whole database, so how long it takes is a question about
  # how much data there is. Twenty minutes is generous for that and still bounded.
  retries: 240
  delay: 5
  no_log: true # hide the API key

- name: Fail if the Meilisearch snapshot was not created
  ansible.builtin.fail:
    msg: >-
      Creating a Meilisearch snapshot did not succeed:
      {{ meilisearch_snapshot_task_result.stdout | from_json }}
  when: "(meilisearch_snapshot_task_result.stdout | from_json).status != 'succeeded'"

- name: Report the created Meilisearch snapshot
  ansible.builtin.debug:
    msg: >-
      A Meilisearch snapshot has been created below `{{ meilisearch_data_path }}/snapshots`
      on the server.
